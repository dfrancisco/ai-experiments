[project]
name = "ai-experiments"
version = "0.1.0"
description = "Experiments in building with AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-experiments = "ai_experiments:main"
ha-ai = "ai_experiments.home_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
